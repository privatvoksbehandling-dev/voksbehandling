<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLAD Admin</title><style>
body{margin:0;background:#fff8f5;font-family:Arial;color:#2b2627}.wrap{max-width:1200px;margin:auto;padding:20px}.box{background:#fff;border:1px solid #ead6d2;border-radius:16px;padding:20px;margin:15px 0}.hide{display:none}input,button,select{padding:11px;border:1px solid #dfcbc7;border-radius:8px;font:inherit}button{background:#cf6879;color:#fff;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;border:1px solid #ead6d2;border-radius:12px}.stat b{display:block;font-size:22px;color:#a94759;margin-top:7px}.expense{display:grid;grid-template-columns:1fr 120px 70px;gap:8px;margin:8px 0}.row{border-top:1px solid #eee;padding:12px 0;font-size:13px}.summary{background:#fff4f1;padding:14px;border-radius:10px;line-height:1.9}@media(max-width:800px){.grid,.stats{grid-template-columns:1fr}.expense{grid-template-columns:1fr 100px 60px}}</style></head><body><div class="wrap">
<div id="login" class="box" style="max-width:400px;margin:70px auto"><h2>GLAD Admin</h2><input id="pw" type="password" placeholder="Admin adgangskode" style="width:100%"><button onclick="login()" style="width:100%;margin-top:10px">Log ind</button><p id="err"></p></div>
<div id="panel" class="hide"><h1>GLAD Admin Kontrolpanel</h1>
<div class="stats"><div class="stat">BOOKINGER<b id="count">0</b></div><div class="stat">OMSÆTNING<b id="revenue">0 kr</b></div><div class="stat">UDGIFTER<b id="expensesTotal">0 kr</b></div><div class="stat">RESULTAT<b id="profit">0 kr</b></div></div>
<div class="grid"><div class="box"><h2>🧾 Indkøb / udgifter</h2><div class="expense"><input id="expName" placeholder="F.eks. Voks eller handsker"><input id="expPrice" type="number" placeholder="Pris"><button onclick="addExpense()">+</button></div><div id="expenses"></div></div>
<div class="box"><h2>🧮 Hurtig beregner</h2><input id="a" type="number" placeholder="Beløb" oninput="calc()" style="width:100%;margin-bottom:8px"><select id="op" onchange="calc()" style="width:100%;margin-bottom:8px"><option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option></select><input id="b" type="number" placeholder="Beløb" oninput="calc()" style="width:100%"><div class="summary" style="margin-top:12px">Resultat: <b id="result">0 kr</b><br><hr>Omsætning: <span id="sr">0 kr</span><br>Udgifter: <span id="se">0 kr</span><br>Resultat: <b id="sp">0 kr</b></div></div></div>
<div class="box"><h2>📅 Bookinger</h2><button onclick="load()">Opdater</button><div id="list"></div></div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbzt-ZG3_oDBnsEFx114tnLS5bpoDzzU93Ax2lKefZPo_lDEXAbK2s-zDio5pMsBtjE1yg/exec";let token=localStorage.getItem("gladAdmin")||"",bookings=[];
const money=n=>Number(n||0).toLocaleString("da-DK",{maximumFractionDigits:2})+" kr";
function login(){token=pw.value;localStorage.setItem("gladAdmin",token);load()}
function ex(){return JSON.parse(localStorage.getItem("gladExpenses")||"[]")}
function save(x){localStorage.setItem("gladExpenses",JSON.stringify(x))}
function addExpense(){let n=expName.value.trim(),p=Number(expPrice.value);if(!n||isNaN(p))return;let x=ex();x.push({id:Date.now(),n,p});save(x);expName.value="";expPrice.value="";render();stats()}
function del(id){save(ex().filter(x=>x.id!=id));render();stats()}
function render(){expenses.innerHTML=ex().map(x=>`<div class="expense"><span>${x.n}</span><b>${money(x.p)}</b><button onclick="del(${x.id})">Sil</button></div>`).join("")||"Ingen udgifter endnu."}
function calc(){let x=Number(a.value||0),y=Number(b.value||0),o=op.value,r=o==="+"?x+y:o==="-"?x-y:o==="*"?x*y:y?x/y:0;result.textContent=money(r)}
function stats(){let active=bookings.filter(x=>x.status!=="Annulleret"),r=active.reduce((s,x)=>s+Number(x.price||0),0),e=ex().reduce((s,x)=>s+Number(x.p||0),0),p=r-e;count.textContent=active.length;revenue.textContent=money(r);expensesTotal.textContent=money(e);profit.textContent=money(p);sr.textContent=money(r);se.textContent=money(e);sp.textContent=money(p)}
async function load(){try{let r=await fetch(API_URL+"?action=list&token="+encodeURIComponent(token)),d=await r.json();if(!d.ok)throw Error(d.message);bookings=d.rows||[];login.classList.add("hide");panel.classList.remove("hide");list.innerHTML=bookings.map(x=>`<div class="row"><b>${x.date} ${x.time}</b> — ${x.name} — ${x.service} — <b>${money(x.price)}</b><br>Not: ${x.note||"-"} | ${x.status}</div>`).join("")||"Ingen bookinger.";render();stats()}catch(e){err.textContent=e.message}}
if(token)load();
</script></body></html>
