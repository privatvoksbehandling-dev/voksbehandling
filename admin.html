<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLAD Admin</title><style>
body{margin:0;background:#fff8f5;font-family:Arial;color:#2b2627}.wrap{max-width:1200px;margin:auto;padding:24px}.box{background:#fff;border:1px solid #ecd8d4;border-radius:16px;padding:22px;margin:15px 0}input,button{padding:11px;border:1px solid #dfcbc7;border-radius:8px;box-sizing:border-box}button{background:#cf6879;color:#fff;border:0;cursor:pointer}.hide{display:none}.row{display:grid;grid-template-columns:90px 110px 1.2fr 1fr 1.2fr 80px 110px 110px;gap:8px;border-top:1px solid #eee;padding:13px 0;font-size:13px;align-items:center}@media(max-width:950px){.row{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div id="login" class="box" style="max-width:400px;margin:80px auto"><h2>GLAD Admin</h2><input id="pw" type="password" placeholder="Admin adgangskode" style="width:100%"><button onclick="login()" style="width:100%;margin-top:10px">Log ind</button><p id="err"></p></div><div id="panel" class="hide"><h1>GLAD – Bookinger</h1><div class="box"><button onclick="load()">Opdater</button><div id="list"></div></div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbyVBAfPrycPOCL1e9wJZDkCtugTeQ-qzt5tTgSWp2TWdFadaAtGTKPo0FjtENTK1OBYCA/exec";let token=localStorage.getItem("gladAdmin")||"";
function login(){token=document.getElementById("pw").value;localStorage.setItem("gladAdmin",token);load()}
async function load(){try{const r=await fetch(API_URL+"?action=list&token="+encodeURIComponent(token));const d=await r.json();if(!d.ok)throw Error(d.message);document.getElementById("login").classList.add("hide");document.getElementById("panel").classList.remove("hide");document.getElementById("list").innerHTML=d.rows.map(function(x){return "<div class='row'><span>"+x.id+"</span><span>"+x.date+"<br>"+x.time+"</span><span><b>"+x.name+"</b><br>"+x.phone+"<br>"+x.email+"</span><span>"+x.service+"</span><span>Not: "+(x.note||"-")+"</span><b>"+x.price+" kr</b><span>"+x.status+"</span><button onclick=\"cancelBooking('"+x.id+"')\">Annuller</button></div>"}).join("")||"<p>Ingen bookinger.</p>"}catch(e){document.getElementById("err").textContent=e.message}}
async function cancelBooking(id){await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"status",token:token,id:id,status:"Annulleret"})});load()}
if(token)load();
</script></body></html>
