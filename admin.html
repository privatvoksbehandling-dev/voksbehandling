<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adminpanel</title><style>
body{margin:0;background:#f6f3f1;font-family:Arial;color:#302826}.wrap{max-width:1100px;margin:auto;padding:20px}.box{background:#fff;border:1px solid #eaded9;border-radius:18px;padding:22px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#faf4f2;padding:18px;border-radius:13px}.stat b{font-size:28px;display:block}input,select,button{padding:11px;border-radius:9px;border:1px solid #ddd;width:100%;box-sizing:border-box}button{background:#9b6b67;color:#fff;border:0;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1.5fr 1fr 1fr auto auto;gap:8px;align-items:center;border-top:1px solid #eee;padding:12px 0;font-size:14px}.login{max-width:400px;margin:90px auto}.hide{display:none}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div id="login" class="box login"><h1>Adminpanel</h1><p>Log ind for at administrere bookinger.</p><input id="pass" type="password" placeholder="Admin adgangskode"><button onclick="login()" style="margin-top:10px">Log ind</button><p id="error" style="color:#a33"></p></div>
<div id="panel" class="hide"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Adminpanel</h1><p>Privat Voksbehandling</p></div><button onclick="logout()" style="width:auto;padding:10px 18px">Log ud</button></div>
<div class="stats"><div class="stat">I dag<b id="today">0</b></div><div class="stat">Denne uge<b id="week">0</b></div><div class="stat">Alle<b id="all">0</b></div><div class="stat">Kommende<b id="next">0</b></div></div>
<div class="box"><h2>Bookinger</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="filterDate" type="date"><select id="filterStatus"><option value="">Alle statuser</option><option>Bekræftet</option><option>Gennemført</option><option>Annulleret</option></select></div><button onclick="load()" style="margin-top:10px">Opdater</button><div id="list"></div></div></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbxiXpRYoR6tPBuxVKjwXUY-zM3uuAfVICS0yMVbJ-QrRiv-iwkkBGnj-xgKD-_epxkiXg/exec";let token=localStorage.getItem("adminToken")||"";
function login(){token=document.getElementById("pass").value;localStorage.setItem("adminToken",token);load()}
async function load(){try{let r=await fetch(API+"?action=list&token="+encodeURIComponent(token));let j=await r.json();if(!j.ok)throw Error(j.message);loginBox.classList.add("hide");panel.classList.remove("hide");render(j.rows)}catch(e){error.textContent=e.message||"Forkert adgangskode"}}
function render(rows){let td=new Date().toISOString().slice(0,10);today.textContent=rows.filter(x=>x.date===td&&x.status!=="Annulleret").length;all.textContent=rows.length;next.textContent=rows.filter(x=>x.date>=td&&x.status!=="Annulleret").length;week.textContent=rows.filter(x=>x.status!=="Annulleret").length;let fd=filterDate.value,fs=filterStatus.value;rows=rows.filter(x=>(!fd||x.date===fd)&&(!fs||x.status===fs));list.innerHTML=rows.map(x=>`<div class="row"><span><b>${x.date}</b><br>${x.time}</span><span>${x.name}<br>${x.phone}</span><span>${x.service}</span><span>${x.status}</span><button onclick="status('${x.id}','Gennemført')">Færdig</button><button onclick="status('${x.id}','Annulleret')">Annuller</button></div>`).join("")||"<p>Ingen bookinger.</p>"}
async function status(id,s){await fetch(API,{method:"POST",body:JSON.stringify({action:"status",token,id,status:s})});load()}function logout(){localStorage.removeItem("adminToken");location.reload()}
const loginBox=document.getElementById("login"),panel=document.getElementById("panel"),error=document.getElementById("error"),list=document.getElementById("list"),today=document.getElementById("today"),week=document.getElementById("week"),all=document.getElementById("all"),next=document.getElementById("next"),filterDate=document.getElementById("filterDate"),filterStatus=document.getElementById("filterStatus");load();
</script></body></html>
