<!doctype html>
<html lang="da">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adminpanel</title>
<style>
body{font-family:Arial;background:#f6f3f1;margin:0;color:#302826}
.container{max-width:1100px;margin:auto;padding:20px}
.box{background:#fff;border:1px solid #eaded9;border-radius:16px;padding:20px;margin:18px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#faf4f2;padding:18px;border-radius:12px}
.stat b{display:block;font-size:28px}
input,button{padding:11px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;width:100%}
button{background:#9b6b67;color:white;border:0;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1.4fr 1.4fr 1fr auto auto;gap:8px;border-top:1px solid #eee;padding:12px 0;font-size:14px}
.hide{display:none}
.login{max-width:400px;margin:80px auto}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div class="container">
<div id="login" class="box login">
<h1>Adminpanel</h1>
<p>Log ind for at administrere bookinger.</p>
<input id="password" type="password" placeholder="Admin adgangskode">
<button id="loginButton" style="margin-top:10px">Log ind</button>
<p id="loginError"></p>
</div>

<div id="panel" class="hide">
<h1>Adminpanel</h1>
<div class="stats">
<div class="stat">I dag<b id="today">0</b></div>
<div class="stat">Denne uge<b id="week">0</b></div>
<div class="stat">Alle<b id="all">0</b></div>
<div class="stat">Kommende<b id="next">0</b></div>
</div>
<div class="box">
<h2>Bookinger</h2>
<button id="refresh">Opdater</button>
<div id="bookings"></div>
</div>
</div>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbzBP6Gs6B4gdTrzrV76ac1cNVn0vwG4YdNCT5xH5RS9AcYXfcigrZp6LGmtyv2n_wak7g/exec';
var token = localStorage.getItem("adminToken") || "";

document.getElementById("loginButton").onclick = function() {
  token = document.getElementById("password").value;
  localStorage.setItem("adminToken", token);
  loadBookings();
};

document.getElementById("refresh").onclick = loadBookings;

async function loadBookings() {
  try {
    var response = await fetch(API + "?action=list&token=" + encodeURIComponent(token));
    var data = await response.json();

    if (!data.ok) {
      throw new Error(data.message || "Login fejl");
    }

    document.getElementById("login").classList.add("hide");
    document.getElementById("panel").classList.remove("hide");
    render(data.rows);

  } catch (error) {
    document.getElementById("loginError").textContent = error.message;
  }
}

function render(rows) {
  var today = new Date().toISOString().slice(0,10);

  document.getElementById("all").textContent = rows.length;
  document.getElementById("today").textContent =
    rows.filter(function(x) { return x.date === today && x.status !== "Annulleret"; }).length;
  document.getElementById("next").textContent =
    rows.filter(function(x) { return x.date >= today && x.status !== "Annulleret"; }).length;
  document.getElementById("week").textContent =
    rows.filter(function(x) { return x.status !== "Annulleret"; }).length;

  var html = "";

  rows.forEach(function(x) {
    html += '<div class="row">';
    html += '<span><b>' + x.date + '</b><br>' + x.time + '</span>';
    html += '<span>' + x.name + '<br>' + x.phone + '</span>';
    html += '<span>' + x.service + '<br><small>Not: ' + (x.note || "-") + '</small></span>';
    html += '<span>' + x.status + '</span>';
    html += '<button onclick="changeStatus(\'' + x.id + '\',\'Gennemført\')">Færdig</button>';
    html += '<button onclick="changeStatus(\'' + x.id + '\',\'Annulleret\')">Annuller</button>';
    html += '</div>';
  });

  document.getElementById("bookings").innerHTML =
    html || "<p>Ingen bookinger.</p>";
}

async function changeStatus(id, status) {
  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "status",
      token: token,
      id: id,
      status: status
    })
  });

  loadBookings();
}

if (token) {
  loadBookings();
}
</script>
</body>
</html>
