<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adminpanel</title>
<style>body{font-family:Arial;background:#f6f3f1;margin:0;color:#302826}.wrap{max-width:1100px;margin:auto;padding:20px}.box{background:#fff;border:1px solid #eaded9;border-radius:16px;padding:20px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#faf4f2;padding:18px;border-radius:12px}.stat b{display:block;font-size:28px}input,button{padding:11px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;width:100%}button{background:#9b6b67;color:#fff;border:0;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1.2fr 1.5fr 1fr auto auto;gap:8px;border-top:1px solid #eee;padding:12px 0;font-size:14px}.hide{display:none}.login{max-width:400px;margin:80px auto}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="wrap"><div id="login" class="box login"><h1>Adminpanel</h1><input id="password" type="password" placeholder="Admin adgangskode"><button id="loginBtn" style="margin-top:10px">Log ind</button><p id="error"></p></div>
<div id="panel" class="hide"><h1>Adminpanel</h1><div class="stats"><div class="stat">I dag<b id="today">0</b></div><div class="stat">Kommende<b id="next">0</b></div><div class="stat">Alle<b id="all">0</b></div><div class="stat">Aktive<b id="active">0</b></div></div><div class="box"><button id="refresh">Opdater</button><div id="list"></div></div></div></div>
<script>
var API_URL='https://script.google.com/macros/s/AKfycbxaeaegkd7mfRTcYxAgTrFzcJOzOPrR12kjKkvZgr4u3yGye91h-4E3AJ1EJFiPq6mv/exec',token=localStorage.getItem("adminToken")||"";
document.getElementById("loginBtn").onclick=function(){token=document.getElementById("password").value;localStorage.setItem("adminToken",token);load();};
document.getElementById("refresh").onclick=load;
async function load(){try{var r=await fetch(API_URL+"?action=list&token="+encodeURIComponent(token));var d=await r.json();if(!d.ok)throw Error(d.message);document.getElementById("login").classList.add("hide");document.getElementById("panel").classList.remove("hide");render(d.rows);}catch(e){document.getElementById("error").textContent=e.message;}}
function render(a){var t=new Date().toISOString().slice(0,10);document.getElementById("all").textContent=a.length;document.getElementById("today").textContent=a.filter(function(x){return x.date===t&&x.status!=="Annulleret";}).length;document.getElementById("next").textContent=a.filter(function(x){return x.date>=t&&x.status!=="Annulleret";}).length;document.getElementById("active").textContent=a.filter(function(x){return x.status==="Bekræftet";}).length;document.getElementById("list").innerHTML=a.map(function(x){return "<div class='row'><span><b>"+x.date+"</b><br>"+x.time+"</span><span>"+x.name+"<br>"+x.phone+"</span><span>"+x.service+"<br><small>Not: "+(x.note||"-")+"</small></span><span>"+x.status+"</span><button onclick=\"setStatus('"+x.id+"','Gennemført')\">Færdig</button><button onclick=\"setStatus('"+x.id+"','Annulleret')\">Annuller</button></div>";}).join("")||"<p>Ingen bookinger.</p>";}
async function setStatus(id,s){await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"status",token:token,id:id,status:s})});load();}
if(token)load();
</script></body></html>
