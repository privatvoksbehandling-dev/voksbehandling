<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voksbehandling – Bestil tid</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4f2;font-family:Arial,sans-serif;color:#292522}
.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 4px 18px #0001}
h1{margin:0 0 6px}h2{margin-top:0}.muted{color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-size:14px;font-weight:bold;display:block;margin-bottom:6px}input,select,button{width:100%;padding:12px;border-radius:10px;font-size:15px}
input,select{border:1px solid #ddd}button{border:0;background:#8b5e58;color:#fff;font-weight:bold;cursor:pointer;margin-top:15px}button:disabled{opacity:.6;cursor:wait}
.ok,.err{display:none;padding:12px;border-radius:10px;margin-top:12px}.ok{background:#eaf7ed;color:#246b32}.err{background:#fdecec;color:#a33}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card"><h1>🌸 Voksbehandling</h1><div class="muted">Bestil tid online</div></div>
<div class="card"><h2>Bestil en tid</h2>
<form id="form"><div class="grid">
<div><label>Navn</label><input id="name" required></div>
<div><label>Telefonnummer</label><input id="phone" type="tel" required placeholder="12 34 56 78"></div>
<div><label>Behandling</label><select id="service" required>
<option value="">Vælg behandling</option><option>Øjenbryn</option><option>Overlæbe</option><option>Ansigt</option><option>Arme</option><option>Ben</option><option>Bikini</option><option>Hele kroppen</option>
</select></div>
<div><label>Dato</label><input id="date" type="date" required></div>
<div><label>Tid</label><select id="time" required><option value="">Vælg tidspunkt</option></select></div>
</div><button id="submit">Bestil tid</button>
<div id="ok" class="ok"></div><div id="err" class="err"></div></form></div>
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxiXpRYoR6tPBuxVKjwXUY-zM3uuAfVICS0yMVbJ-QrRiv-iwkkBGnj-xgKD-_epxkiXg/exec";
const times=["10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30"];
const d=document.getElementById("date"),t=document.getElementById("time");
const today=new Date().toISOString().slice(0,10); d.min=today; d.value=today;
times.forEach(x=>t.insertAdjacentHTML("beforeend","<option>"+x+"</option>"));
document.getElementById("form").onsubmit=async e=>{
 e.preventDefault(); const btn=document.getElementById("submit"),ok=document.getElementById("ok"),err=document.getElementById("err");
 ok.style.display="none";err.style.display="none";btn.disabled=true;
 const data={name:document.getElementById("name").value.trim(),phone:document.getElementById("phone").value.trim(),service:document.getElementById("service").value,date:d.value,time:t.value};
 try{const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(data)});const j=await r.json();
 if(!j.ok)throw new Error(j.message||"Kunne ikke bestille tid");
 ok.textContent="✓ Din tid er blevet bestilt. Virksomheden har modtaget besked.";ok.style.display="block";e.target.reset();d.value=today;
 }catch(x){err.textContent="Kunne ikke bestille tid: "+x.message;err.style.display="block"}finally{btn.disabled=false}
};
</script>
</body></html>
